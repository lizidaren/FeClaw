# =============================================================================
# FeClaw locked dependencies (exact versions, single source of truth)
#
# Layering:  requirements.txt      = declaration layer (deps + ranges, reviewable)
#            requirements.lock     = lock layer (verified exact versions, reproducible)
#            requirements-dev.txt  = test group declaration  (lock group: test)
#            requirements-fuse.txt = FUSE group declaration  (lock group: fuse)
# Installing only from this file cannot drift from the tested matrix, so there is
# exactly one lock and no second contradictory pin list.
#
# Baseline: repo e2adb08, Python 3.12.9 (Windows); full pytest run passed on this
# venv. Versions come from that venv's `pip freeze` -- nothing is pinned blind.
#
# How this file was produced (T19a):
#   1) static audit of real imports (AST over 345 .py files; module-level vs
#      function-level vs guarded) reconciled against requirements*.txt;
#   2) `pip freeze` of the verified venv;
#   3) manual grouping (core / optional / fuse / test); everything frozen beyond
#      the direct deps goes to `transitive`;
#   4) explicit exclusions for unused/uninstallable packages (see tail of file).
#
# Reproduce in a clean venv:
#   python -m venv .venv-clean
#   .venv-clean/Scripts/python -m pip install -U pip
#   .venv-clean/Scripts/python -m pip install -r requirements.lock
#   .venv-clean/Scripts/python -m pip check        # expect: No broken requirements
#   .venv-clean/Scripts/python -m pip freeze       # compare with this file
# Core-only install: copy this file's `core` group into a constraints file,
#   e.g.  pip install -r <(sed -n '/group: core/,/^$/p' requirements.lock)
#
# Group semantics:
#   core       required to start and serve (module-level imports / framework runtime)
#   optional   feature-on-demand (lazy or ImportError-guarded import); missing =>
#              that feature reports unavailable, the app still starts
#   fuse       FUSE mounting only; core/optional must never contain these
#   test       test framework
#   transitive verified transitive closure of the above (keeps parity with the
#              tested venv)
#
# Names use canonical PyPI spelling; normalize [-_.] -> '-' and lowercase before
# comparing. Every pin is `==`; this file contains no `>=` / `~=` / `*`.
#
# Known limits (out of scope for T19a):
#   * no `--hash` entries yet, so Dockerfile cannot use `--require-hashes`; adding
#     hashes needs a reproducible wheel cache (T19b).
#   * openai / pyfuse3 are not installable on this host -> no verified version,
#     so they are declared but NOT locked (see `pending` at the tail).
#   * the clean-venv install matrix (no FUSE / missing helpers / missing model
#     key / missing Redis) is T19b; this file does not claim it.
# =============================================================================

